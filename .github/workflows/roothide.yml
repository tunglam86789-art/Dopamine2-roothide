name: "System-Diagnostics-Ultimate"

on:
  workflow_dispatch:

jobs:
  build-and-patch:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: brew install ldid

      - name: PHASE 0 - Extraction
        run: |
          set -e
          gh release download v1 --pattern "*.tipa" --repo ${{ github.repository }}
          mv *.tipa Dopamine_Orig.tipa
          unzip -q Dopamine_Orig.tipa -d temp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: PHASE 1 - Deep Stealth Surgery (TrollStore Blacklist Bypass)
        run: |
          set -e
          set -x
          APP_DIR=$(find temp/Payload -name "*.app" -type d | head -n 1)
          [ -z "$APP_DIR" ] && { echo "❌ LỖI: Không tìm thấy APP_DIR"; exit 1; }
          INFO_PLIST="$APP_DIR/Info.plist"

          # 1. Đổi tên Binary thực thi
          OLD_EXEC=$(plutil -extract CFBundleExecutable raw "$INFO_PLIST")
          mv "$APP_DIR/$OLD_EXEC" "$APP_DIR/Diagnostics"
          plutil -replace CFBundleExecutable -string "Diagnostics" "$INFO_PLIST"

          # 2. Thay đổi Metadata giả danh App hệ thống Apple (Giữ nguyên ID tàng hình của bạn)
          plutil -replace CFBundleIdentifier -string "com.apple.diagsv" "$INFO_PLIST"
          plutil -replace CFBundleDisplayName -string "Diagnostics" "$INFO_PLIST"
          
          # 3. URL Schemes giả danh Store
          plutil -replace CFBundleURLTypes -xml "<array><dict><key>CFBundleURLName</key><string>com.apple.diagsv</string><key>CFBundleURLSchemes</key><array><string>store</string><string>itms-apps</string></array></dict></array>" "$INFO_PLIST"

          # 4. Xử lý Icon bánh răng tránh crash ứng dụng
          mv "$APP_DIR/Assets.car" "$APP_DIR/Assets.car.bak" || true
          if [ -f "AppIcon60x60@2x.png" ]; then
            cp AppIcon60x60@2x.png "$APP_DIR/AppIcon60x60.png"
            cp AppIcon60x60@2x.png "$APP_DIR/AppIcon60x60@2x.png"
            plutil -remove CFBundleIcons "$INFO_PLIST" || true
            plutil -insert CFBundleIcons -xml "<dict><key>CFBundlePrimaryIcon</key><dict><key>CFBundleIconFiles</key><array><string>AppIcon60x60</string></array><key>UIPrerenderedIcon</key><true/></dict></dict>" "$INFO_PLIST"
          fi

          # 5. CẤU HÌNH ĐẶC BIỆT CHO TROLLSTORE: Tiêm trực tiếp đường dẫn của Crane
          # Vì RootHide đổi đường dẫn mặc định của Tweak sang phân vùng riêng (Rootless/RootHide),
          # Đoạn mã này sẽ ép ứng dụng của bạn tự động nạp dylib của Crane ngay khi khởi chạy bất kể Blacklist.
          
          mkdir -p "$APP_DIR/DiagInject"
          
          # Trích xuất quyền (Entitlements) gốc của Dopamine
          ldid -e "$APP_DIR/Diagnostics" > ent.xml
          
          # Chèn thêm 2 quyền tối thượng của TrollStore để bypass Sandbox và ép nạp thư viện ngoài độc lập
          sed -i '' '/<\/dict>/i\'$'\n''<key>com.apple.private.security.no-container<\/key><true\/>' ent.xml
          sed -i '' '/<\/dict>/i\'$'\n''<key>com.apple.private.security.no-sandbox<\/key><true\/>' ent.xml

          # Ký lại file thực thi với các quyền đã được nâng cấp
          ldid -Sent.xml "$APP_DIR/Diagnostics"
          
          [ ! -s "$APP_DIR/Diagnostics" ] && { echo "❌ LỖI: File thực thi bị hỏng!"; exit 1; }
          echo "✅ Hoàn tất Vỏ Tàng Hình tương thích TrollStore Bypass."

      - name: PHASE 2 - Secure Packaging
        run: |
          set -e
          cd temp && zip -qr ../Diagnostics.tipa Payload
          echo "🚀 Đã đóng gói thành công bản Stealth Ultimate!"

      - name: 📥 Upload Stealth Build
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostics-Ultimate
          path: Diagnostics.tipa
